<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>North Star Consumer Matrix Demo Report — design mockup</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --canvas:#F4F7FB; --wall:#DCE5F0; --surface:#FFFFFF; --header:#0B2545; --header-text:#FFFFFF; --header-muted:#C7D6EA;
  --text:#0F1B2D; --muted:#475569; --border:#D5DEEA; --accent:#1D4ED8; --tab:#7DD3FC;
  --ac:#0B2545; --py:#94A3B8; --bud:#0E7490; --tgt:#B45309; --fav:#15803D; --adv:#B91C1C; --amber:#D97706;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--wall);font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--text)}
#stage{position:fixed;inset:0;overflow:hidden}
#canvas{width:1920px;height:1080px;background:var(--canvas);position:absolute;left:50%;top:50%;transform-origin:center center;box-shadow:0 4px 24px rgba(11,37,69,.18)}
/* grid: margin 32, gutter 16, 12x12 */
.region{position:absolute}
header.hdr{position:absolute;left:0;top:0;width:1920px;height:108px;background:var(--header);display:flex;align-items:center;padding:0 40px;gap:40px}
.hdr h1{margin:0;font-size:26px;font-weight:600;color:var(--header-text);white-space:nowrap}
.hdr nav{display:flex;gap:6px;flex:1;justify-content:center}
.tab{background:transparent;border:0;color:var(--header-muted);font:500 15px "Segoe UI",sans-serif;padding:10px 16px 8px;border-bottom:3px solid transparent;cursor:pointer}
.tab:hover{color:#fff;background:#13315C;border-radius:4px 4px 0 0}
.tab.active{color:#fff;border-bottom-color:var(--tab)}
.util{display:flex;gap:10px}
.btn-o{background:transparent;border:1px solid var(--header-muted);color:#fff;font:600 14px "Segoe UI",sans-serif;height:32px;padding:0 16px;border-radius:4px;cursor:pointer}
.btn-o:hover{background:#13315C}
.btn-o:focus-visible,.tab:focus-visible,.tile:focus-visible,.dd-btn:focus-visible{outline:2px solid var(--tab);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:6px;display:flex;flex-direction:column;overflow:hidden}
.panel h2{font-size:16px;font-weight:600;margin:0;padding:14px 18px 4px}
.panel .sub{font-size:12px;color:var(--muted);padding:0 18px 8px}
/* Super Filter band */
.sf{flex-direction:row;align-items:center;gap:0;padding:0 18px;overflow:visible}
.sf-group{display:flex;flex-direction:column;gap:4px;padding:0 22px;border-right:1px solid var(--border)}
.sf-group:first-child{padding-left:0}
.sf-group:last-of-type{border-right:0}
.sf-label{font-size:12px;font-weight:600;color:var(--muted)}
.tiles{display:flex;gap:6px}
.tile{border:1px solid var(--border);background:#EEF3F9;color:var(--text);font:13px "Segoe UI",sans-serif;padding:5px 14px;border-radius:4px;cursor:pointer;white-space:nowrap}
.tile:hover{border-color:var(--accent)}
.tile.on{background:var(--header);color:#fff;border-color:var(--header)}
.sf-clear{margin-left:auto;color:var(--accent);font-size:13px;text-decoration:underline;cursor:pointer;background:none;border:0}
.dd{position:relative}
.dd-btn{min-width:190px;text-align:left;border:1px solid var(--border);background:#fff;font:13px "Segoe UI",sans-serif;padding:5px 28px 5px 10px;border-radius:4px;cursor:pointer;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.dd-btn:after{content:"▾";position:absolute;right:10px;color:var(--muted)}
.dd-pop{display:none;position:absolute;top:34px;left:0;z-index:50;background:#fff;border:1px solid var(--border);border-radius:6px;box-shadow:0 8px 24px rgba(11,37,69,.18);width:300px;max-height:380px;overflow:auto;padding:8px}
.dd.open .dd-pop{display:block}
.dd-pop input[type=search]{width:100%;font:13px "Segoe UI";padding:6px 8px;border:1px solid var(--border);border-radius:4px;margin-bottom:6px}
.dd-pop label{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 4px;cursor:pointer;border-radius:3px}
.dd-pop label:hover{background:#EEF3F9}
.dd-pop .lvl1{padding-left:22px}.dd-pop .lvl2{padding-left:40px}
.dd-pop .cnt{margin-left:auto;color:var(--muted);font-size:11px}
.dd-actions{display:flex;justify-content:space-between;border-top:1px solid var(--border);margin-top:6px;padding-top:6px}
.dd-actions button{background:none;border:0;color:var(--accent);font-size:12px;cursor:pointer}
select.msel{font:13px "Segoe UI";border:1px solid var(--border);border-radius:4px;padding:4px 6px;background:#fff}
/* KPI */
.kpis{display:flex;gap:16px}
.kpi{flex:1;background:#fff;border:1px solid var(--border);border-radius:6px;border-left:4px solid var(--ac);padding:12px 18px 8px;display:flex;flex-direction:column;min-width:0}
.kpi .t{font-size:14px;color:var(--muted)}
.kpi .v{font-size:30px;font-weight:700;line-height:1.15;margin:2px 0 4px}
.kpi .c{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.kpi .c b{font-weight:600}
.kpi svg{margin-top:auto}
.pos{color:var(--fav)}.neg{color:var(--adv)}.na{color:var(--muted)}
/* Matrix */
.mx-wrap{flex:1;overflow:auto;margin:0 10px 10px}
table.mx{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.mx th{position:sticky;top:0;background:#F8FAFC;color:var(--muted);font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;z-index:2}
.mx th.grp{top:0;text-align:center;color:var(--text);background:#EEF3F9;border-bottom:1px solid var(--border);cursor:default}
.mx thead tr.r2 th{top:33px}
.mx th:first-child{text-align:left;position:sticky;left:0;z-index:3}
.mx th .srt{font-size:10px;margin-left:3px;color:var(--accent)}
.mx td{padding:0 10px;height:34px;text-align:right;border-bottom:1px solid #EEF2F7;white-space:nowrap;position:relative;font-variant-numeric:tabular-nums}
.mx td:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:1;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.mx tr.l0 td:first-child{font-weight:600}
.mx tr.l1 td:first-child{padding-left:30px}
.mx tr.l2 td:first-child{padding-left:50px;color:#334155}
.mx tr.l3 td:first-child{padding-left:70px;color:#334155}
.mx tr.tot td{font-weight:700;border-top:2px solid var(--header);background:#F8FAFC}
.mx tr.tot td:first-child{background:#F8FAFC}
.mx tr.others td:first-child{font-style:italic;color:var(--muted)}
.mx tr:hover td{background-color:#F5F8FC}
.tog{display:inline-block;width:16px;color:var(--accent);cursor:pointer;font-size:11px;user-select:none}
.tog.none{cursor:default}
.mx td.colsep, .mx th.colsep{border-left:1px solid var(--border)}
.bar{position:absolute;left:6px;top:7px;bottom:7px;background:#C7D7EE;border-right:3px solid var(--ac);border-radius:2px}
.cellv{position:relative;z-index:1}
.vbar{display:inline-block;position:relative;width:70px;height:14px;vertical-align:middle;margin-right:8px;background:linear-gradient(to right,transparent 49.5%,#94A3B8 49.5%,#94A3B8 50.5%,transparent 50.5%)}
.vbar i{position:absolute;top:2px;bottom:2px;border-radius:1px}
.ico{font-size:10px;margin-left:5px}
.rag-g{background:#DCFCE7}.rag-a{background:#FEF3C7}.rag-r{background:#FEE2E2}
.legend{display:flex;gap:14px;align-items:center;font-size:11.5px;color:var(--muted);padding:0 18px 8px;flex-wrap:wrap}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:4px}
.grad{display:inline-block;width:80px;height:10px;border-radius:2px;vertical-align:-1px;margin:0 4px}
.foot{position:absolute;right:40px;bottom:8px;font-size:11px;color:#64748B}
/* utility pages */
.util-body{padding:24px 40px;font-size:15px;line-height:1.55;overflow:auto}
.util-body h3{font-size:17px;margin:18px 0 6px;color:var(--header)}
.util-body table{border-collapse:collapse;font-size:14px}
.util-body td,.util-body th{border-bottom:1px solid var(--border);padding:6px 14px 6px 0;text-align:left;vertical-align:top}
.page{display:none}.page.active{display:block}
</style>
</head>
<body>
<div id="stage"><div id="canvas">
  <header class="hdr">
    <h1 id="pageTitle">North Star Consumer Matrix — Overview</h1>
    <nav id="nav" aria-label="Report pages"></nav>
    <div class="util">
      <button class="btn-o" data-go="help">Help</button>
      <button class="btn-o" data-go="info">Info</button>
    </div>
  </header>
  <div id="pages"></div>
  <div class="foot">Design mockup of the planned Fabric Plan Intelligence sheets · live extract of SM Sales Performance Dashboard-AI Test, captured 19 Nov 2026 · source INR shown with $</div>
</div></div>

<script src="mockup-data.js"></script>
<script>
"use strict";
/* ---------- geometry: 1920x1080, margin 32, gutter 16, 12x12 grid ---------- */
const CW=1920,CH=1080,M=32,G=16,COL=(CW-2*M)/12,ROW=(CH-2*M)/12;
function rect(c1,r1,c2,r2){return{left:M+(c1-1)*COL+G/2,top:M+(r1-1)*ROW+G/2,width:(c2-c1)*COL-G,height:(r2-r1)*ROW-G}}
const R={filters:rect(1,2,13,3),kpis:rect(1,3,13,5),main:rect(1,5,9,13),side:rect(9,5,13,13),body:rect(1,2,13,13)};
R.filters.top=116; R.filters.height=ROW-G+6;

/* ---------- data ---------- */
const D=window.NSDATA, P=D.P, C=D.C, CHN=D.CH, F=D.F;
// F row: 0 order,1 year,2 month,3 cust,4 prod,5 chan,6 qty,7 net,8 cogs,9 gross,10 disc,11 budNet,12 budCogs,13 tgtNet,14 tgtCogs
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const uniq=a=>[...new Set(a)];
const CATS=uniq(P.map(p=>p[1])).sort(), BRANDS=uniq(P.map(p=>p[3])).sort();
const REGIONS=["North","South","East","West"], SEGS=["Enterprise","Mid-Market","SMB","Retail Consumer"];
function agg(rows){const a={ns:0,cogs:0,gross:0,disc:0,qty:0,bud:0,budc:0,tgt:0,tgtc:0,o:new Set(),n:0};
  for(const r of rows){a.ns+=r[7];a.cogs+=r[8];a.gross+=r[9];a.disc+=r[10];a.qty+=r[6];a.bud+=r[11];a.budc+=r[12];a.tgt+=r[13];a.tgtc+=r[14];a.o.add(r[0]);a.n++}
  return a}
const M_={ // measure functions over an aggregate (null when no rows, like DAX blank)
  ns:a=>a&&a.n?a.ns:null, bud:a=>a&&a.n?a.bud:null, tgt:a=>a&&a.n?a.tgt:null, qty:a=>a&&a.n?a.qty:null,
  gp:a=>a&&a.n?a.ns-a.cogs:null, gm:a=>a&&a.n&&a.ns?(a.ns-a.cogs)/a.ns:null,
  budgp:a=>a&&a.n?a.bud-a.budc:null, budgm:a=>a&&a.n&&a.bud?(a.bud-a.budc)/a.bud:null,
  tgtgm:a=>a&&a.n&&a.tgt?(a.tgt-a.tgtc)/a.tgt:null,
  orders:a=>a&&a.n?a.o.size:null, aov:a=>a&&a.n?a.ns/a.o.size:null, discp:a=>a&&a.n&&a.gross?a.disc/a.gross:null
};
const dlt=(x,y)=>x==null||y==null?null:x-y;
const pct=(x,y)=>x==null||y==null||y===0?null:(x-y)/Math.abs(y);

/* ---------- formatting ($ display over INR source, K/M scaling) ---------- */
function money(v,dec){if(v==null)return"–";const s=v<0?"−":"",a=Math.abs(v);
  if(a>=1e6)return s+"$"+(a/1e6).toFixed(dec??2)+"M"; if(a>=1e3)return s+"$"+(a/1e3).toFixed(dec??0)+"K"; return s+"$"+a.toFixed(0)}
function smoney(v){if(v==null)return"–";return(v>0?"+":"")+money(v).replace("−","−")}
const num=v=>v==null?"–":Math.round(v).toLocaleString("en-US");
const pc=(v,d=1)=>v==null?"–":(v*100).toFixed(d)+"%";
const sgn=v=>Math.abs(v)<0.0005?"":(v>0?"+":"−");
const spc=(v,d=1)=>v==null?"–":sgn(v)+Math.abs(v*100).toFixed(d)+"%";
const spp=v=>v==null?"–":sgn(v)+Math.abs(v*100).toFixed(1)+" pp";
const isZero=v=>v==null||Math.abs(v)<0.0005;
const cls=(v,lowerBetter)=>isZero(v)?"na":((v>0)!==!!lowerBetter?"pos":"neg");
const arrow=v=>isZero(v)?"":(v>0?"▲":"▼");

/* ---------- colour scales ---------- */
const SEQ=["#EFF6FF","#BFDBFE","#60A5FA","#1D4ED8","#0B2545"], DIV=["#B91C1C","#FCA5A5","#F8FAFC","#86EFAC","#15803D"];
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
function interp(stops,t){t=Math.max(0,Math.min(1,t));const s=t*(stops.length-1),i=Math.min(Math.floor(s),stops.length-2),f=s-i;
  const a=hex(stops[i]),b=hex(stops[i+1]);const c=a.map((x,k)=>Math.round(x+(b[k]-x)*f));
  const lum=(0.299*c[0]+0.587*c[1]+0.114*c[2]);return{bg:`rgb(${c})`,fg:lum<140?"#fff":"#0F1B2D"}}
function seqStyle(v,min,max){if(v==null)return"";const t=max>min?(v-min)/(max-min):.5;const c=interp(SEQ,t);return`background:${c.bg};color:${c.fg}`}
function divStyle(v,absMax){if(v==null)return"";const t=absMax?0.5+v/(2*absMax):.5;const c=interp(DIV,t);return`background:${c.bg};color:${c.fg}`}

/* ---------- state ---------- */
const S={year:2025,page:"overview",ret:"overview",
  f:{overview:{reg:new Set(),ch:new Set()},
     product:{m0:1,m1:12,cat:new Set(),sub:new Set(),brand:new Set()},
     budget:{reg:new Set(),ch:new Set(),brand:new Set()},
     geo:{reg:new Set(),st:new Set(),ci:new Set(),ch:new Set()},
     cust:{seg:new Set(),reg:new Set(),cus:new Set()}},
  exp:{}, sort:{}};
function pageRows(pg,year,ignoreMonth){
  const f=S.f[pg];return F.filter(r=>{if(r[1]!==year)return false;const p=P[r[4]],c=C[r[3]];
    if(f.reg&&f.reg.size&&!f.reg.has(c[4]))return false;
    if(f.ch&&f.ch.size&&!f.ch.has(CHN[r[5]]))return false;
    if(f.brand&&f.brand.size&&!f.brand.has(p[3]))return false;
    if(f.cat&&(f.cat.size||f.sub.size)&&!(f.cat.has(p[1])||f.sub.has(p[1]+"|"+p[2])))return false;
    if(f.st&&(f.st.size||f.ci.size)&&!(f.reg.has(c[4])||f.st.has(c[3])||f.ci.has(c[3]+"|"+c[2])))return false;
    if(f.seg&&f.seg.size&&!f.seg.has(c[1]))return false;
    if(f.cus&&f.cus.size&&!f.cus.has(r[3]))return false;
    if(!ignoreMonth&&f.m0&&(r[2]<f.m0||r[2]>f.m1))return false;
    return true})}
// geo page: region tiles are part of the hierarchy filter, so handle combined selection
function geoRows(year){const f=S.f.geo;const any=f.reg.size||f.st.size||f.ci.size;
  return F.filter(r=>{if(r[1]!==year)return false;const c=C[r[3]];
    if(f.ch.size&&!f.ch.has(CHN[r[5]]))return false;
    if(any&&!(f.reg.has(c[4])||f.st.has(c[3])||f.ci.has(c[3]+"|"+c[2])))return false;return true})}
const rowsFor=(pg,y)=>pg==="geo"?geoRows(y):pageRows(pg,y);

/* ---------- KPI cards ---------- */
function spark(rows,fn,color){const by=Array.from({length:12},()=>[]);rows.forEach(r=>by[r[2]-1].push(r));
  const v=by.map(b=>b.length?fn(agg(b)):null).filter(x=>x!=null);if(v.length<2)return"<svg height='34'></svg>";
  const w=300,h=34,mn=Math.min(...v),mx=Math.max(...v),sx=w/(v.length-1);
  const pts=v.map((y,i)=>`${(i*sx).toFixed(1)},${(h-4-(mx>mn?(y-mn)/(mx-mn):.5)*(h-8)).toFixed(1)}`).join(" ");
  const last=pts.split(" ").pop().split(",");
  return`<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" role="img" aria-label="monthly trend"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${color}"/></svg>`}
function kpiCard(o){ // o: title,color,val,fmt,comps:[{lab,d,kind,lower}],spark
  const comps=o.comps.map(c=>{const t=c.kind==="pp"?spp(c.d):spc(c.d);return`<div class="c">${c.lab} <b class="${cls(c.d,c.lower)}">${arrow(c.d)} ${t}</b></div>`}).join("");
  return`<div class="kpi" style="border-left-color:${o.color}"><div class="t">${o.title}</div><div class="v">${o.fmt(o.val)}</div>${comps}${o.spark||""}</div>`}

/* ---------- Matrix engine ---------- */
/* spec: {id, levels:[{name,key:r=>k,label:k=>s}], cols:[{h,grp,f:(ac,py)=>v,fmt,cf,lower,sep}], topN, sortDefault:{col,dir}, pyRows, acRows} */
function buildTree(spec){
  const ac=spec.acRows, py=spec.pyRows||[];
  function node(path,lvl,acR,pyR){const n={path,lvl,ac:agg(acR),py:agg(pyR),kids:null};
    if(lvl<spec.levels.length){const L=spec.levels[lvl];const ga=new Map(),gp=new Map();
      acR.forEach(r=>{const k=L.key(r);(ga.get(k)||ga.set(k,[]).get(k)).push(r)});
      pyR.forEach(r=>{const k=L.key(r);if(ga.has(k))(gp.get(k)||gp.set(k,[]).get(k)).push(r)});
      n.kids=[...ga.keys()].map(k=>{const c=node(path.concat([k]),lvl+1,ga.get(k),gp.get(k)||[]);c.label=L.label?L.label(k):k;c.key=k;return c});
      sortKids(spec,n);
      if(spec.topN&&lvl===spec.topN.level&&n.kids.length>spec.topN.n){const keep=n.kids.slice(0,spec.topN.n),rest=n.kids.slice(spec.topN.n);
        const o={path:path.concat(["__others"]),lvl:lvl+1,label:`Others (${rest.length})`,others:true,kids:null,ac:merge(rest.map(x=>x.ac)),py:merge(rest.map(x=>x.py))};
        n.kids=keep.concat([o])}}
    return n}
  return node([],0,ac,py)}
function merge(list){const a={ns:0,cogs:0,gross:0,disc:0,qty:0,bud:0,budc:0,tgt:0,tgtc:0,o:new Set(),n:0};
  list.forEach(b=>{for(const k of["ns","cogs","gross","disc","qty","bud","budc","tgt","tgtc","n"])a[k]+=b[k];b.o.forEach(x=>a.o.add(x))});return a}
function sortKids(spec,n){const s=S.sort[spec.id]||spec.sortDefault;
  if(!s){if(spec.levels[n.lvl].order)n.kids.sort((a,b)=>spec.levels[n.lvl].order(a.key)-spec.levels[n.lvl].order(b.key));return}
  const col=spec.cols[s.col];n.kids.sort((a,b)=>{const x=col.f(a.ac,a.py),y=col.f(b.ac,b.py);if(x==null)return 1;if(y==null)return-1;return s.dir*(x-y)})}
function renderMatrix(el,spec){
  const root=buildTree(spec);const exp=S.exp[spec.id]||(S.exp[spec.id]=new Set(spec.expandDefault||[]));
  const vis=[];(function walk(n){if(n.kids)n.kids.forEach(k=>{vis.push(k);if(k.kids&&exp.has(k.path.join("/")))walk(k)})})(root);
  // column stats for CF over visible rows (values only, not totals)
  const stats=spec.cols.map(c=>{const v=vis.filter(n=>c.cfAll||n.lvl===vis.reduce((m,x)=>Math.max(m,x.lvl),0)||!c.leafOnly).map(n=>c.f(n.ac,n.py)).filter(x=>x!=null);
    return{min:Math.min(...v),max:Math.max(...v),abs:Math.max(...v.map(Math.abs),1e-9)}});
  const s=S.sort[spec.id]||spec.sortDefault;
  let head="";const grps=spec.cols.some(c=>c.grp);
  if(grps){let g="<tr><th class='grp'></th>";let i=0;while(i<spec.cols.length){const gname=spec.cols[i].grp||"";let j=i;while(j<spec.cols.length&&(spec.cols[j].grp||"")===gname)j++;g+=`<th class="grp colsep" colspan="${j-i}">${gname}</th>`;i=j}head+=g+"</tr>"}
  head+=`<tr class="${grps?"r2":""}"><th>${spec.levels.map(l=>l.name).join(" › ")}</th>`+spec.cols.map((c,i)=>`<th data-i="${i}" class="${c.sep?"colsep":""}" style="${c.cf==="bar"?"width:190px;min-width:190px":""}" title="Sort">${c.h}${s&&s.col===i?`<span class="srt">${s.dir>0?"▲":"▼"}</span>`:""}</th>`).join("")+"</tr>";
  const cell=(c,i,n,tot)=>{const v=c.f(n.ac,n.py);const st=stats[i];let style="",inner=c.fmt(v),cl=c.sep?"colsep":"";
    if(v!=null&&!(tot&&!c.cfTotals))switch(c.cf){
      case"bar":{const w=st.max>0?Math.max(0,v)/st.max:0;inner=`<span class="bar" style="width:calc(${w.toFixed(3)} * (100% - 84px))"></span><span class="cellv">${inner}</span>`;break}
      case"seq":style=seqStyle(v,st.min,st.max);break;
      case"div":style=divStyle(v,st.abs);break;

    b.kp.innerHTML=K("Net Sales vs Budget","#0B2545",M_.ns,v=>money(v),[{lab:"vs BUD",d:pct(M_.ns(A),M_.bud(A))},vPY(M_.ns)])+
      K("Discount %","#B45309",M_.discp,v=>pc(v,2),[{lab:"vs PY",d:dlt(M_.discp(A),M_.discp(PYa)),kind:"pp",lower:true}])+
      K("Gross Margin %","#7C3AED",M_.gm,v=>pc(v),[ppPY(M_.gm)]);
    setHead(b.main,"Region › State › City",`${Y}${pyNote} · data bars, margin gradient, icons on Δ BUD %`,["bar","seq","icon","avg"]);
    renderMatrix(mainW,{id:"geo-h",acRows:ac,pyRows:py,levels:[{name:"Region",key:r=>C[r[3]][4]},{name:"State",key:r=>C[r[3]][3]},{name:"City",key:r=>C[r[3]][2]}],sortDefault:{col:0,dir:-1},cols:[
      {h:"Net Sales",f:a=>M_.ns(a),fmt:v=>money(v),cf:"bar"},{h:"PY",f:(a,p)=>M_.ns(p),fmt:v=>money(v)},{h:"Δ PY %",f:(a,p)=>pct(M_.ns(a),M_.ns(p)),fmt:spc,cf:"sem"},
      {h:"Budget",f:a=>M_.bud(a),fmt:v=>money(v),sep:true},{h:"Δ BUD %",f:a=>pct(M_.ns(a),M_.bud(a)),fmt:spc,cf:"icon"},
      {h:"GM %",f:a=>M_.gm(a),fmt:v=>pc(v),cf:"seq",sep:true},{h:"Discount %",f:a=>M_.discp(a),fmt:v=>pc(v,2),cf:"avg",lower:true}]});
    setHead(b.side,"Growth heatmap — region × quarter",Y===2024?"Δ PY % needs prior-year data: select 2025":`${Y} Net Sales Δ PY % · diverging scale`,["div"]);
    renderCross(sideW,{rowName:"Region",rows:REGIONS,rowKey:r=>C[r[3]][4],cols:[1,2,3,4],colKey:r=>Math.ceil(r[2]/3),colLabel:q=>"Q"+q,val:(a,p)=>pct(M_.ns(a),M_.ns(p)),fmt:spc,cf:"div",totals:true,acRows:ac,pyRows:py});
  }
  if(id==="cust"){
    b.kp.innerHTML=K("Net Sales","#0B2545",M_.ns,v=>money(v),[vPY(M_.ns)])+K("Total Orders","#15803D",M_.orders,num,[vPY(M_.orders)])+
      K("Avg Order Value","#B45309",M_.aov,v=>money(v,2),[vPY(M_.aov)])+K("Discount %","#7C3AED",M_.discp,v=>pc(v,2),[{lab:"vs PY",d:dlt(M_.discp(A),M_.discp(PYa)),kind:"pp",lower:true}]);
    setHead(b.main,"Top 10 customers per segment + Others",`${Y}${pyNote} · ranked by Net Sales · AOV colour scale`,["bar","seq","avg"]);
    renderMatrix(mainW,{id:"cu-t",acRows:ac,pyRows:py,topN:{level:1,n:10},expandDefault:[SEGS.find(s=>!S.f.cust.seg.size||S.f.cust.seg.has(s))],levels:[{name:"Segment",key:r=>C[r[3]][1]},{name:"Customer",key:r=>C[r[3]][0]}],sortDefault:{col:0,dir:-1},cols:[
      {h:"Net Sales",f:a=>M_.ns(a),fmt:v=>money(v),cf:"bar"},{h:"PY",f:(a,p)=>M_.ns(p),fmt:v=>money(v)},{h:"Δ PY %",f:(a,p)=>pct(M_.ns(a),M_.ns(p)),fmt:spc,cf:"sem"},
      {h:"Orders",f:a=>M_.orders(a),fmt:num,sep:true},{h:"AOV",f:a=>M_.aov(a),fmt:v=>money(v,2),cf:"seq"},{h:"GM %",f:a=>M_.gm(a),fmt:v=>pc(v)},
      {h:"Discount %",f:a=>M_.discp(a),fmt:v=>pc(v,2),cf:"avg",lower:true}]});
    setHead(b.side,"Segment × channel",`${Y} Net Sales · table-wise colour scale with totals`,["seq"]);
    renderCross(sideW,{rowName:"Segment",rows:SEGS,rowKey:r=>C[r[3]][1],cols:CHN,colKey:r=>CHN[r[5]],colLabel:c=>c.replace(" Partner","").replace(" Sales",""),val:a=>M_.ns(a),fmt:v=>money(v),cf:"seq",totals:true,acRows:ac});
  }
}
function renderAll(){render(S.page)}
function go(id){if(!built[id])build(id);if(!PAGES.find(p=>p.id===id).utility)S.ret=id;S.page=id;
  document.querySelectorAll(".page").forEach(p=>p.classList.toggle("active",p.id==="pg-"+id));
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.go===id));
  document.getElementById("pageTitle").textContent=PAGES.find(p=>p.id===id).title;render(id)}
const HELP=`<h3>Navigate</h3>Use the tabs in the navy header to switch pages. <b>Help</b> and <b>Info</b> open these utility pages; <b>Back to report</b> returns to the page you came from with its filters intact.
<h3>Filter</h3><b>Year</b> is shared by every page (2024–2025). Tiles toggle on and off; no selection means all. Dropdowns hold larger lists — the Customer list is searchable, and the hierarchy filters let you pick a whole Region/Category or individual States, Cities and Subcategories. <b>Clear all</b> resets the current page.
<h3>Read the Matrix</h3>Click <b>▶</b> to expand a hierarchy level and <b>▼</b> to collapse it. Click a column header to sort (click again to reverse). Totals are recalculated from the underlying measures, so ratios and distinct order counts are never summed.
<h3>Colours and icons</h3><table><tr><td>Data bar</td><td>Length shows magnitude within the column.</td></tr><tr><td>Variance bar</td><td>Green right = favourable, red left = adverse; length relative to the largest gap.</td></tr><tr><td>▲ / ▼</td><td>Favourable / adverse change. Arrows always accompany colour.</td></tr><tr><td>Blue heatmap</td><td>Light = low, navy = high.</td></tr><tr><td>Red–green scale</td><td>Red = behind, white ≈ on par, green = ahead.</td></tr><tr><td>RAG cells</td><td>Red &lt; −5%, amber −5% to 0%, green ≥ 0%.</td></tr></table>`;
const INFO=`<h3>Measures</h3><table>
<tr><th>Label</th><th>Model measure</th><th>Definition</th></tr>
<tr><td>Net Sales (AC)</td><td>Net Sales</td><td>Net revenue after discounts.</td></tr>
<tr><td>PY</td><td>PY …</td><td>Same period last year (SAMEPERIODLASTYEAR on DimDate).</td></tr>
<tr><td>Budget (BUD)</td><td>BUD Net Sales, BUD Profit Margin %</td><td>Budgeted net revenue and margin.</td></tr>
<tr><td>Target (TGT)</td><td>Target Net Sales, Target Profit Margin %</td><td>Stretch target net revenue and margin.</td></tr>
<tr><td>Gross Margin %</td><td>Gross Margin %</td><td>(Net Sales − COGS) ÷ Net Sales.</td></tr>
<tr><td>Avg Order Value</td><td>Average Order Value</td><td>Net Sales ÷ distinct orders.</td></tr>
<tr><td>Discount %</td><td>Discount %</td><td>Discount ÷ Gross Sales; lower is better.</td></tr>
<tr><td>Δ, Δ %</td><td>visual calculation</td><td>Actual − comparison; Δ % = Δ ÷ comparison. Margin differences are in percentage points (pp).</td></tr></table>
<h3>Data notes</h3>Source: semantic model <b>SM Sales Performance Dashboard-AI Test</b> (Planning-Demos). Amounts are stored in <b>INR</b> and displayed with a <b>$</b> sign by design choice; no currency conversion is applied. Sales data covers Jan 2024 – Dec 2025, so prior-year comparisons are available for 2025 only. Region is the customer's region (DimRegion links to sales through DimCustomer).
<h3>About this page</h3>This is an interactive design mockup of the planned Fabric Plan Intelligence report, built from a read-only extract captured 19 Nov 2026. Matrix behaviour in Fabric Plan may differ in detail.`;
