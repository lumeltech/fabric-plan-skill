# Template for the Design Brief contract (fabric-plan-intelligence). See references/intelligence/design/design-brief.md.
Design Brief:
  generated_by: fabric-plan-intelligence
  contract_version: 1
  mode: greenfield
  session_theme: {} # Required: complete resolved profile from design/session-theme.md.
  design_system: design/design-system.md # Or the path of the user's design MD file.
  design_identity: { tone: "", signature: "", ibcs: false, ibcs_theme: null }
  # Optional companion fields (design/design-brief.md, Additional details): design_identity may add family_id,
  # appearance, density, decoration, selection_reason, preference_evidence and verification; this level may add
  # storyline, playbooks, preserve, interaction_detail, model_gaps, library_gaps and assumptions.
  color_map: { strategy: measure_match, measures: {} }
  navigation_model: "" # Resolve from the session profile; no universal default.
  sync_slicers: []
  sheets:
    - name: ""
      role: landing
      archetype: "" # Optional example name, IBCS or Custom; never infer from report type.
      layout_variant: "" # Reuse the session's page-role template.
      variant_rationale: "" # User/session choice and analytical suitability.
      canvas_background: "" # Resolve from session palette.
      # Optional: header_copy, reference_fidelity (none | semantic | exact; only to reproduce a reference on request).
      super_filter_layout:
        position: "" # top_band | left_rail | right_rail | inline | popup | custom | none
        region_ids: [] # Actual named regions; each filter also needs a placement.
        rationale: ""
        overflow_behavior: "" # Include open/closed behavior for popup/collapsible designs.
      layout_contract:
        # Replace this illustrative grid with the session's resolved page-role layout.
        canvas: { type: keep-existing, width: 1920, height: 1080, units: normalized, margin_px: 32, gutter_px: 16 }
        grid:
          columns: 12
          rows: 12
          regions:
            header:  [1, 1, 8, 2]
            filters: [8, 1, 13, 2]
            kpis:    [1, 2, 13, 4]
            main:    [1, 4, 13, 13]
        placements:
          # Add Help/Info controls, targets and actions unless explicitly opted out.
          - { id: sheet_title, region: header, kind: "element:text", text: "" }
          # Optional per placement: selection_rationale, sort_policy, color_strategy, polarity, aggregation, kpi_style, px_rect.
        space_audit: { content_cell_count: 0, placed_cell_count: 0, empty_cell_pct: 0, unplaced_regions: [], balance_rationale: "" }
  interaction_pattern: cross_filter
  accessibility: { contrast: WCAG_AA, color_independent_cues: true, titles_plain_language: true }
  # Optional accessibility keys: contrast_notes, reading_order.
